<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Neural Circuit | AI News for Techies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                        },
                        dark: {
                            bg: '#0a0a0a',
                            surface: '#171717',
                            border: '#262626'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .shorts-scroll::-webkit-scrollbar { width: 4px; }
        .shorts-scroll::-webkit-scrollbar-track { background: #171717; }
        .shorts-scroll::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 4px; }
        .glass-panel { background: rgba(23, 23, 23, 0.7); backdrop-filter: blur(10px); border: 1px solid #262626; }
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; border: 1px solid #262626; cursor: pointer; }
        .hover-lift:hover { transform: translateY(-2px); border-color: #4ade80; }
        .skeleton { background: linear-gradient(90deg, #171717 25%, #262626 50%, #171717 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-dark-bg text-gray-300 font-sans antialiased min-h-screen flex flex-col">

    <header class="border-b border-dark-border bg-dark-bg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center py-4 md:py-6 gap-4 md:gap-0">
                <div class="hidden md:flex flex-col text-xs font-mono text-gray-500 w-1/3">
                    <span id="current-date">Fetching Date...</span>
                    <span class="text-brand-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-brand-400 animate-pulse"></span> Auto-updating via AI
                    </span>
                </div>
                
                <div class="text-center flex-1 w-full md:w-1/3">
                    <h1 class="text-3xl md:text-5xl font-serif font-bold text-white tracking-tight">
                        The Neural <span class="text-brand-400">Circuit</span>
                    </h1>
                </div>

                <div class="flex flex-row items-center justify-end w-full md:w-1/3 gap-3 md:gap-4 mt-4 md:mt-0">
                    <div class="relative flex-1 md:w-48 group flex"> <!-- Added 'flex' here -->
                        <input type="text" id="search-input" placeholder="Search news..." class="w-full bg-dark-surface border border-dark-border text-white text-sm rounded-full pl-10 pr-4 py-2 focus:outline-none focus:border-brand-400 transition-all">
                        <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <button onclick="document.getElementById('auth-modal').classList.remove('hidden')" class="px-4 py-2 text-sm font-medium text-dark-bg bg-brand-400 hover:bg-brand-500 rounded-md transition-colors whitespace-nowrap shadow-[0_0_15px_rgba(74,222,128,0.15)]">
                        Join 2.5M Techies
                    </button>
                </div>
            </div>
            
            <nav id="category-nav" class="flex space-x-6 overflow-x-auto py-3 text-sm font-medium text-gray-400 border-t border-dark-border scrollbar-hide">
                <a href="#" data-category="AI" class="nav-tab text-white border-b-2 border-brand-400 pb-2 whitespace-nowrap">Live Feed</a>
                <a href="#" data-category="LLMs and Foundation Models" class="nav-tab hover:text-white border-b-2 border-transparent pb-2 whitespace-nowrap transition-colors">LLMs & Models</a>
                <a href="#" data-category="Computer Vision" class="nav-tab hover:text-white border-b-2 border-transparent pb-2 whitespace-nowrap transition-colors">Computer Vision</a>
                <a href="#" data-category="Robotics" class="nav-tab hover:text-white border-b-2 border-transparent pb-2 whitespace-nowrap transition-colors">Robotics</a>
                <a href="#" data-category="AI Policy & Ethics" class="nav-tab hover:text-white border-b-2 border-transparent pb-2 whitespace-nowrap transition-colors">Policy & Ethics</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="flex flex-col lg:flex-row gap-10">
            <div class="lg:w-2/3 w-full space-y-8" id="news-section">
                <div id="dynamic-news-container" class="space-y-8">
                    <div class="skeleton h-64 w-full rounded-xl"></div>
                </div>
            </div>

            <aside class="lg:w-1/3 w-full flex flex-col h-auto lg:h-[800px]">
                <h3 class="text-lg font-bold text-white font-mono uppercase tracking-wider mb-4 border-b border-dark-border pb-2">Trending Shorts</h3>
                <div class="shorts-scroll overflow-y-auto pr-2 space-y-4 flex-grow">
                    <!-- Sidebar populated by JS -->
                </div>
            </aside>
        </div>
    </main>

    <!-- Modals -->
    <div id="auth-modal" class="fixed inset-0 z-[130] hidden items-center justify-center bg-black/90 backdrop-blur-md">
        <div class="bg-dark-surface border border-dark-border rounded-xl p-8 max-w-md w-full mx-4">
            <button onclick="document.getElementById('auth-modal').classList.add('hidden')" class="float-right text-gray-400">Close</button>
            <h3 class="text-2xl font-bold text-white mb-6">Join the Circuit</h3>
            <form action="https://formspree.io/f/mjgnqgzb" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="Full Name" required class="w-full bg-dark-bg border border-dark-border p-3 rounded">
                <input type="email" name="email" placeholder="Email Address" required class="w-full bg-dark-bg border border-dark-border p-3 rounded">
                <button type="submit" class="w-full py-3 bg-brand-400 text-dark-bg font-bold rounded">Join Now</button>
            </form>
        </div>
    </div>

    <div id="ai-modal" class="fixed inset-0 z-[140] hidden items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="bg-dark-surface border border-indigo-500 rounded-2xl p-6 max-w-2xl w-full max-h-[85vh] flex flex-col">
            <div class="flex justify-between mb-4"><h3 class="text-xl font-bold text-white">Gemini Insights</h3><button onclick="document.getElementById('ai-modal').classList.add('hidden')" class="text-gray-400">Close</button></div>
            <div id="ai-response-area" class="flex-grow overflow-y-auto bg-dark-bg p-4 rounded text-sm text-gray-300">Select an action.</div>
        </div>
    </div>

    <!-- NEW: Full Article Detail Modal -->
    <div id="article-detail-modal" class="fixed inset-0 z-[150] hidden items-center justify-center bg-black/95 backdrop-blur-md p-4">
        <div class="bg-dark-surface border border-dark-border rounded-2xl p-8 max-w-3xl w-full max-h-[90vh] overflow-y-auto relative">
            <button onclick="document.getElementById('article-detail-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕ Close</button>
            <h2 id="article-detail-title" class="text-3xl font-serif font-bold text-white mb-6"></h2>
            <!-- Added whitespace-pre-line to ensure paragraph breaks render correctly -->
            <div id="article-detail-content" class="text-gray-300 leading-relaxed text-lg whitespace-pre-line"></div>
        </div>
    </div>

    <script>
        const apiKey = "YOUR_API_KEY_HERE"; 
        
        // Modal functions
        window.openArticleDetail = (title, content) => {
            // Decode the content so it reads perfectly
            document.getElementById('article-detail-title').textContent = decodeURIComponent(title);
            document.getElementById('article-detail-content').textContent = decodeURIComponent(content);
            document.getElementById('article-detail-modal').classList.remove('hidden');
            document.getElementById('article-detail-modal').classList.add('flex');
        };

        window.openAIModal = (title, text, event) => {
            if(event) event.stopPropagation(); // Stop click from opening full article when clicking AI button
            document.getElementById('ai-modal').classList.remove('hidden');
            document.getElementById('ai-modal').classList.add('flex');
            document.getElementById('ai-response-area').innerHTML = `<div class="animate-pulse">Generating insights for: ${title}...</div>`;
            
            // Mock AI response
            setTimeout(() => {
                document.getElementById('ai-response-area').innerHTML = `<strong>Insight:</strong> This development regarding "${title}" signifies a major shift in the industry landscape. The rapid acceleration of these technologies suggests that regulatory frameworks will need to adapt quickly.`;
            }, 1500);
        };

        // Fallback Data for full articles
        const fallbackArticles = [
            {
                title: "GPT-6 Architecture Leaked: What We Know",
                category: "LLMs and Foundation Models",
                summary: "Rumors suggest the next generation model will feature a radical departure from traditional transformer architecture.",
                content: "Detailed reports have emerged regarding the architecture of GPT-6. Unlike its predecessors, which relied heavily on static transformer models, GPT-6 is rumored to integrate continuous learning mechanisms.\n\nThis means the model could potentially update its knowledge base in real-time without requiring massive retraining cycles. Experts suggest this could reduce computing costs by up to 40% while significantly improving contextual accuracy.\n\nFurthermore, early benchmarks leaked by insiders indicate a 10x improvement in complex reasoning tasks, putting it closer to human-level problem-solving in specialized domains. The shift to a Mixture-of-Experts (MoE) approach is also expected to be vastly scaled up, utilizing over 100 trillion parameters.",
                author: "Sarah Chen",
                time: "2h ago"
            },
            {
                title: "Sora 2.0 Generates Perfect Physics",
                category: "Computer Vision",
                summary: "OpenAI's updated video model now understands fluid dynamics and glass reflections with 100% accuracy.",
                content: "OpenAI has quietly rolled out an update to its Sora video generation model, pushing its capabilities into hyper-realism. The most notable improvement is its flawless understanding of real-world physics.\n\nPreviously, AI video struggled with fluid dynamics (like water splashing) and complex reflections. Sora 2.0 uses a new spatial-temporal rendering engine that mathematically simulates physics rather than just hallucinating pixels. This breakthrough means visual effects studios can now use generated footage for cinematic sequences without post-processing.",
                author: "Marcus Wei",
                time: "4h ago"
            },
            {
                title: "EU AI Act Takes Effect Today",
                category: "AI Policy & Ethics",
                summary: "Tech giants face fines up to 7% of global revenue as the strict new European regulations become law.",
                content: "The highly anticipated European Union AI Act has officially come into force today, setting a global precedent for artificial intelligence regulation.\n\nThe act classifies AI systems by risk, completely banning 'unacceptable risk' applications like social scoring and real-time biometric identification in public spaces. 'High-risk' systems, such as AI used in hiring or healthcare, must now undergo rigorous compliance checks.\n\nTech giants like Google, Meta, and OpenAI must adapt their models immediately. Failure to comply could result in unprecedented fines of up to 35 million Euros or 7% of their total global annual turnover, whichever is higher.",
                author: "Elena Rossi",
                time: "6h ago"
            },
            {
                title: "Figure 02 Robot Starts Work at BMW",
                category: "Robotics",
                summary: "The humanoid robot is now fully autonomous on the manufacturing floor, performing complex assembly tasks.",
                content: "In a major milestone for industrial robotics, Figure AI's second-generation humanoid robot, Figure 02, has been officially deployed on the factory floor at the BMW manufacturing plant in Spartanburg.\n\nPowered by advanced neural networks and vision-language models, the robot operates completely autonomously, handling delicate sheet metal components and inserting them into precision machinery. Unlike traditional robotic arms, Figure 02 can walk around the factory, identify parts dynamically, and adapt to changing environments in real-time, signaling a massive shift in modern manufacturing.",
                author: "Dr. Aris Thorne",
                time: "8h ago"
            },
            {
                title: "AlphaFold 3 Maps the Unknown",
                category: "BioAI",
                summary: "DeepMind's latest breakthrough predicts the structure of all life's molecules, not just proteins.",
                content: "Google DeepMind has unveiled AlphaFold 3, expanding its revolutionary AI beyond just proteins. The new model can predict the structures and interactions of almost all of life's molecules, including DNA, RNA, and small pharmaceutical molecules.\n\nThis holistic view of cellular biology allows researchers to see exactly how drugs interact with targets in the human body. The development is expected to shave years off the drug discovery process, potentially leading to faster cures for complex diseases like Alzheimer's and certain types of cancer.",
                author: "Priya Patel",
                time: "12h ago"
            }
        ];

        const fallbackShorts = [
            { title: "Nvidia hits $3T", content: "Nvidia has officially surpassed a $3 trillion market cap, driven by unprecedented demand for AI chips and data center expansions." },
            { title: "Apple Intelligence Beta", content: "Apple has released the first beta of Apple Intelligence to developers, bringing on-device AI features to iOS 18." },
            { title: "Mistral's Codestral", content: "European AI startup Mistral has launched Codestral, a powerful new open-weight model specifically designed for code generation." },
            { title: "Tesla Robotaxi Delay", content: "Elon Musk announced a two-month delay to the highly anticipated Robotaxi reveal event to make design changes." }
        ];

        async function fetchDynamicNews(category = 'AI') {
            const container = document.getElementById('dynamic-news-container');
            container.innerHTML = `<div class="flex justify-center py-20"><div class="skeleton h-64 w-full max-w-2xl rounded-xl"></div></div>`;
            
            // Simulate network delay for effect
            setTimeout(() => {
                container.innerHTML = ''; 
                
                // Filter based on clicked tab
                const filteredArticles = category === 'AI' ? fallbackArticles : fallbackArticles.filter(a => a.category.toLowerCase().includes(category.toLowerCase()) || category.toLowerCase().includes(a.category.toLowerCase()));
                const articlesToRender = filteredArticles.length > 0 ? filteredArticles : fallbackArticles.slice(0,2);

                articlesToRender.forEach((article, index) => {
                    const isLead = index === 0;
                    // Safely encode text so quotes don't break HTML attributes
                    const encTitle = encodeURIComponent(article.title);
                    const encContent = encodeURIComponent(article.content);
                    
                    const articleHTML = `
                        <article onclick="openArticleDetail('${encTitle}', '${encContent}')" class="glass-panel p-6 rounded-2xl hover-lift group ${isLead ? 'border-brand-400/30 bg-gradient-to-br from-dark-surface to-dark-bg' : 'cursor-pointer'}">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-xs font-mono text-brand-400 border border-brand-400/30 px-2 py-1 rounded-full">${article.category}</span>
                                <span class="text-xs text-gray-500 font-mono">${article.time}</span>
                            </div>
                            <h2 class="${isLead ? 'text-3xl' : 'text-xl'} font-serif font-bold text-white mb-3 group-hover:text-brand-400 transition-colors">${article.title}</h2>
                            <p class="text-gray-400 text-sm leading-relaxed mb-4">${article.summary}</p>
                            <div class="flex justify-between items-center pt-4 border-t border-dark-border">
                                <span class="text-xs text-gray-500">By ${article.author}</span>
                                <button onclick="openAIModal('${article.title}', '${article.summary}', event)" class="flex items-center gap-2 text-xs font-medium text-brand-400 hover:text-white transition-colors z-10 relative">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                    AI Summary
                                </button>
                            </div>
                        </article>
                    `;
                    container.innerHTML += articleHTML;
                });
            }, 500);
        }

        function populateShorts() {
            const sidebar = document.querySelector('.shorts-scroll');
            sidebar.innerHTML = '';
            fallbackShorts.forEach(short => {
                const encTitle = encodeURIComponent(short.title);
                const encContent = encodeURIComponent(short.content);
                sidebar.innerHTML += `
                    <div onclick="openArticleDetail('${encTitle}', '${encContent}')" class="glass-panel p-4 rounded-xl hover-lift group cursor-pointer">
                        <h4 class="text-sm font-bold text-white mb-1 group-hover:text-brand-400 transition-colors">${short.title}</h4>
                        <p class="text-xs text-gray-400 line-clamp-2">${short.content}</p>
                    </div>
                `;
            });
        }

        // Search logic
        document.getElementById('search-input').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            
            document.querySelectorAll('article').forEach(el => {
                const text = el.textContent.toLowerCase();
                el.style.display = text.includes(val) ? 'block' : 'none';
            });

            document.querySelectorAll('.shorts-scroll > div').forEach(el => {
                const text = el.textContent.toLowerCase();
                el.style.display = text.includes(val) ? 'block' : 'none';
            });
        });

        // Tabs Logic
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-tab').forEach(t => {
                    t.classList.remove('text-white', 'border-brand-400');
                    t.classList.add('text-gray-400', 'border-transparent');
                });
                tab.classList.remove('text-gray-400', 'border-transparent');
                tab.classList.add('text-white', 'border-brand-400');
                
                fetchDynamicNews(tab.getAttribute('data-category'));
            });
        });

        // Initialize Dates and Data
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchDynamicNews();
            populateShorts();
        });
    </script>
</body>
</html>
